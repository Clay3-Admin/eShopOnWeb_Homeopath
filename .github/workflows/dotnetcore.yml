name: CI

on:
  push:
    branches:
      - main
      - 10012026
  pull_request:
    branches:
      - main
      - 10012026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./eShopOnWeb.sln

      - name: Build
        run: dotnet build ./eShopOnWeb.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ./eShopOnWeb.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Vulnerability scan
        shell: pwsh
        run: |
          $output = dotnet list ./eShopOnWeb.sln package --vulnerable --include-transitive 2>&1
          $exitCode = $LASTEXITCODE
          $text = $output | Out-String
          Write-Output $text

          if ($text -match 'has the following vulnerable packages') {
            exit 1
          }

          $onlyUnsupportedPackageConfigProject = (
            $text -match 'docker-compose\.dcproj' -and
            $text -match 'package\.config' -and
            $text -notmatch 'error:'
          )

          if ($exitCode -ne 0 -and -not $onlyUnsupportedPackageConfigProject) {
            exit $exitCode
          }
